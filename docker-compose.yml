version: '3.8'

services:
  fedtopk-moderator:
    build: .
    container_name: fedtopk-moderator
    working_dir: /workspace
    command: bash docker_run_ec2.sh
    environment:
      - PYTHONPATH=/workspace/src
      - LD_LIBRARY_PATH=/usr/local/lib
      - ROLE=moderator
      - NODE_ID=0
      - CONTAINER_NAME=fedtopk-moderator
      - NUM_PARTIES=3
      - NUM_WORKERS=8
    networks:
      - fedtopk-network
    ports:
      - "2000:2000"
      - "2001:2001"
      - "2002:2002"
      - "2100:3000"
      - "2101:3001"
      - "2102:3002"
      - "2103:3003"
      - "2104:3004"
      - "2105:3005"
      - "2106:3006"
      - "2107:3007"
      - "2200:3999"
    privileged: true
    healthcheck:
      test: ["CMD", "netstat", "-tuln", "|", "grep", ":3999"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fedtopk-worker-1:
    build: .
    container_name: fedtopk-worker-1
    working_dir: /workspace
    command: bash -c "sleep 30 && source /workspace/Kenv/bin/activate && /workspace/Kenv/bin/python3.11 src/worker.py raisin l1 equal 16 3 8 vertical secure 3 fedtopk-worker-1,fedtopk-worker-2,fedtopk-worker-3,fedtopk-worker-4,fedtopk-worker-5,fedtopk-worker-6,fedtopk-worker-7,fedtopk-worker-8,fedtopk-party-1,fedtopk-party-2,fedtopk-party-3,fedtopk-moderator"
    environment:
      - PYTHONPATH=/workspace/src
      - LD_LIBRARY_PATH=/usr/local/lib
      - ROLE=worker
      - NODE_ID=1
      - CONTAINER_NAME=fedtopk-worker-1
    networks:
      - fedtopk-network
    depends_on:
      fedtopk-moderator:
        condition: service_healthy
    ports:
      - "10000:2000"
      - "10001:2001"
      - "10002:2002"
      - "10100:3000"
      - "10101:3001"
      - "10102:3002"
      - "10103:3003"
      - "10104:3004"
